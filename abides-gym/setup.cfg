[metadata]
name = abides-gym
version = 0.1.0
description = ABIDES: Agent-Based Interactive Discrete Event Simulation environment
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/tuckerbalch/jpmc-abides

[options]
packages = find:
python_requires = >=3.9
install_requires =
    abides-markets
    numpy >= 1.23, < 2.0
    gym >= 0.26

# RL training stack is opt-in: ray + wandb are only used by the example runner
# scripts in scripts/, not by the importable package. Install with:
#   pip install -e ./abides-gym[rllib]
[options.extras_require]
rllib =
    ray[rllib] >= 2.0
    wandb >= 0.13
    tqdm >= 4.0
