[metadata]
name = abides-core
version = 0.1.0
description = ABIDES: Agent-Based Interactive Discrete Event Simulation environment
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/tuckerbalch/jpmc-abides

[options]
packages = find:
# Class environment uses Python 3.9 (Docker image: python:3.9-slim-bookworm).
# Lower bound 3.9 reflects what we actually test against.
python_requires = >=3.9
install_requires =
    numpy >= 1.23, < 2.0
    pandas >= 1.5, < 3.0
    coloredlogs >= 15.0
