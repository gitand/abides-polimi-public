[metadata]
name = abides-markets
version = 0.1.0
description = ABIDES: Agent-Based Interactive Discrete Event Simulation environment
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/tuckerbalch/jpmc-abides

[options]
packages = find:
python_requires = >=3.9
install_requires =
    abides-core
    numpy >= 1.23, < 2.0
    pandas >= 1.5, < 3.0
    scipy >= 1.10
    gym >= 0.26
    # pomegranate 1.x is a complete rewrite with a different API; pin to the
    # legacy 0.x line that ABIDES was written against.
    pomegranate >= 0.14, < 1.0
